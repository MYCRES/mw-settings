<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Watcher</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-secondary-bg-color, #efeff4);
  --surface: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --raised: var(--tg-theme-bg-color, #f6f6f8);
  --line: var(--tg-theme-section-separator-color, rgba(128, 128, 140, 0.28));
  --text: var(--tg-theme-text-color, #1b1b1f);
  --hint: var(--tg-theme-hint-color, #85858f);
  --accent: var(--tg-theme-button-color, #2f7cf6);
  --accent-ink: var(--tg-theme-button-text-color, #ffffff);
  --link: var(--tg-theme-link-color, #2f7cf6);
  --danger: var(--tg-theme-destructive-text-color, #e0463e);
  --heading: var(--tg-theme-section-header-text-color, var(--tg-theme-hint-color, #6d6d78));
  --tag: var(--tg-theme-button-color, #2f7cf6);
  --tag-ink: var(--tg-theme-button-text-color, #ffffff);
  --radius-group: 14px;
  --radius-field: 9px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.4 -apple-system, "SF Pro Text", Roboto, "Segoe UI", "Helvetica Neue", sans-serif;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 96px;
}
button, input, select, textarea { font: inherit; color: inherit; }
.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  padding: 12px 16px 10px;
  border-bottom: 1px solid var(--line);
}
.title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.app-name { font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.dirty-note { font-size: 13px; color: var(--accent); font-variant-numeric: tabular-nums; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--raised); border-radius: 11px; padding: 3px; gap: 3px; }
.tab { border: 0; background: transparent; border-radius: 8px; padding: 7px 4px; font-size: 14px; color: var(--hint); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--text); font-weight: 600; }
main { padding: 4px 16px 24px; max-width: 640px; margin: 0 auto; }
.group-title { margin: 22px 4px 7px; font-size: 13px; font-weight: 600; color: var(--heading); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.group { background: var(--surface); border-radius: var(--radius-group); overflow: hidden; }
.row { padding: 11px 14px; }
.row + .row { border-top: 1px solid var(--line); }
.row-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.label { font-size: 15px; }
.hint { font-size: 12.5px; color: var(--hint); margin-top: 3px; }
.field-label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 5px; }
.input, .select, .textarea {
  width: 100%; background: var(--raised); border: 1px solid var(--line); border-radius: var(--radius-field);
  padding: 9px 10px; outline: none; -webkit-appearance: none; appearance: none;
}
.textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
.textarea.url { min-height: 64px; font-size: 13px; word-break: break-all; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.input.invalid, .textarea.invalid { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
.input.short { width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
.pair { display: flex; gap: 10px; }
.pair > label { flex: 1 1 0; }
.suffix { display: inline-flex; align-items: center; gap: 6px; color: var(--hint); font-size: 14px; }
.suffix .input { color: var(--text); font-size: 15px; }
.name-input { font-weight: 600; }
.search-name { font-weight: 650; font-size: 16px; }
.text-button { border: 0; background: none; color: var(--link); padding: 0; cursor: pointer; font-size: 15px; }
.text-button.small { font-size: 13px; }
.text-button.danger { color: var(--danger); }
.text-button:disabled { color: var(--hint); cursor: default; }
.add-row { padding: 12px 14px; }
.switch { position: relative; width: 50px; height: 30px; flex: 0 0 auto; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 15px; background: rgba(128, 128, 140, 0.4); transition: background 0.15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); transition: transform 0.15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 0 2px; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 6px 13px; cursor: pointer; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip.new { color: var(--link); border-style: dashed; }
/* Model limits look like price tags: the one bold element of the page. */
.tag-row { display: flex; align-items: center; gap: 10px; }
.tag {
  position: relative; flex: 1 1 auto; min-width: 0; height: 42px; margin-left: 13px;
  background: var(--tag); color: var(--tag-ink); border-radius: 0 9px 9px 0;
  display: flex; align-items: center; padding: 0 10px 0 10px;
}
.tag::before {
  content: ""; position: absolute; left: -13px; top: 0;
  border-top: 21px solid transparent; border-bottom: 21px solid transparent; border-right: 13px solid var(--tag);
}
.tag::after {
  content: ""; position: absolute; left: -3px; top: 50%; width: 8px; height: 8px; margin-top: -4px;
  border-radius: 50%; background: var(--surface);
}
.tag input { width: 100%; min-width: 0; border: 0; background: transparent; outline: none; font-weight: 650; color: inherit; padding: 0 0 0 6px; }
.tag input::placeholder { color: inherit; opacity: 0.55; }
.tag input:focus-visible { text-decoration: underline; }
.price-box { display: flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.price-box .input { width: 112px; text-align: right; font-variant-numeric: tabular-nums; }
.price-box .input::placeholder { font-size: 13px; }
.currency { color: var(--hint); }
.remove { border: 0; background: none; color: var(--hint); font-size: 22px; line-height: 1; padding: 4px 2px 6px; cursor: pointer; }
.remove:hover, .remove:focus-visible { color: var(--danger); }
.pattern-line { display: flex; align-items: center; gap: 10px; margin: 7px 0 0 13px; }
.pattern-line .input { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; padding: 6px 8px; }
.palette-row { display: flex; align-items: center; gap: 12px; cursor: pointer; width: 100%; border: 0; background: none; text-align: left; padding: 12px 14px; }
.palette-row + .palette-row { border-top: 1px solid var(--line); }
.swatches { display: grid; grid-template-columns: repeat(2, 14px); grid-template-rows: repeat(2, 14px); gap: 3px; flex: 0 0 auto; border-radius: 6px; overflow: hidden; }
.swatches i { display: block; }
.palette-text { flex: 1 1 auto; }
.check { color: var(--accent); font-size: 18px; visibility: hidden; }
.palette-row[aria-checked="true"] .check { visibility: visible; }
.notice { position: fixed; left: 12px; right: 12px; bottom: 16px; z-index: 10; padding: 12px 14px; border-radius: 12px; background: var(--text); color: var(--bg); font-size: 14px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); }
.notice.error { background: var(--danger); color: #fff; }
.group-hint { margin: 7px 4px 0; }
.group-hint.above { margin: -2px 4px 8px; }
.more-link { margin-top: 5px; }
.details { margin-top: 6px; padding: 9px 11px; border-radius: var(--radius-field); background: var(--raised); font-size: 13px; line-height: 1.45; color: var(--text); }
.empty { margin: 48px 8px; text-align: center; color: var(--hint); }
.empty strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 8px; }
.fallback-save { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
.fallback-save button { width: 100%; border: 0; border-radius: 10px; padding: 13px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.fallback-save button:disabled { opacity: 0.5; }
@media (prefers-reduced-motion: reduce) { .switch span, .switch span::after { transition: none; } }
</style>
</head>

<header class="top">

  return JSON.parse(JSON.stringify(value));
}

function stableStringify(value) {
  if (Array.isArray(value)) return "[" + value.map(stableStringify).join(",") + "]";
  if (value && typeof value === "object") {
    return "{" + Object.keys(value).sort().map((key) => JSON.stringify(key) + ":" + stableStringify(value[key])).join(",") + "}";
  }
  return JSON.stringify(value);
}

function linesOf(text) {
  return String(text || "").split("\n").map((line) => line.trim()).filter(Boolean);
}

function integerOrNull(value, allowNegative) {
  const text = String(value === undefined || value === null ? "" : value).trim();
  if (text === "") return 0;
  if (!(allowNegative ? /^-?\d+$/ : /^\d+$/).test(text)) return null;
  return parseInt(text, 10);
}

function escapeRegularExpression(text) {
  return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function patternFromLabel(label) {
  const tokens = String(label || "").toLowerCase().replace(/\u0451/g, "\u0435").split(/[\s\-_/]+/).filter(Boolean);
  if (!tokens.length) return "";
  let start = tokens.findIndex((token) => /\d{3,}/.test(token));
  if (start < 0) start = tokens.findIndex((token) => /\d/.test(token));
  if (start < 0) return tokens.map(escapeRegularExpression).join("\\s*-?\\s*");
  const core = [tokens[start]];
  for (let index = start + 1; index < tokens.length && !/\d/.test(tokens[index]); index += 1) core.push(tokens[index]);
  const body = core.map(escapeRegularExpression).join("\\s*-?\\s*");
  const before = /^\d/.test(core[0]) ? "(?<!\\d)" : "";
  const after = /\d$/.test(core[core.length - 1]) ? "(?!\\d)" : "(?![a-z\u0430-\u044f])";
  return before + body + after;
}

function base64UrlToBytes(text) {
  let normalized = text.replace(/-/g, "+").replace(/_/g, "/");
  while (normalized.length % 4) normalized += "=";
  const binary = atob(normalized);
  const bytes = new Uint8Array(binary.length);
  for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
  return bytes;
}

function bytesToBase64Url(bytes) {
  let binary = "";
  for (let index = 0; index < bytes.length; index += 0x8000) {
    binary += String.fromCharCode.apply(null, bytes.subarray(index, index + 0x8000));
  }
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

async function inflateText(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
  return new TextDecoder().decode(await new Response(stream).arrayBuffer());
}

async function deflateText(text) {
  const stream = new Blob([new TextEncoder().encode(text)]).stream().pipeThrough(new CompressionStream("deflate"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

function hashData() {
  for (const part of location.hash.replace(/^#/, "").split("&")) {
    if (part.startsWith("mw=")) return part.slice(3);
  }
  return "";
}

let noticeTimer = null;
function showNotice(text, kind) {
  const notice = document.getElementById("notice");
  notice.textContent = text;
  notice.className = "notice" + (kind === "error" ? " error" : "");
  notice.hidden = false;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { notice.hidden = true; }, 6000);
  if (kind === "error" && webApp && webApp.HapticFeedback) {
    try { webApp.HapticFeedback.notificationOccurred("error"); } catch (error) { /* older clients */ }
  }
}

// ----- the edited copy of the settings --------------------------------------------------

function toDraft(snapshot) {
  const copy = clone(snapshot);
  for (const search of copy.searches) {
    for (const field of SEARCH_NUMBER_FIELDS) {
      if (["check_interval_seconds", "minimum_price", "maximum_price"].includes(field) && !search[field]) search[field] = "";
      else search[field] = String(search[field]);
    }
  }
  for (const profile of Object.values(copy.profiles)) {
    profile.flag_list = Object.entries(profile.flag_phrases || {}).map(([name, phrases]) => ({ name, phrases: phrases.slice() }));
    delete profile.flag_phrases;
    for (const rule of profile.price_rules) rule.maximum_price = rule.maximum_price ? String(rule.maximum_price) : "";
  }
  for (const [key, type] of Object.entries(copy.general_types)) {
    if (type !== "bool" && key in copy.general) copy.general[key] = String(copy.general[key]);
  }
  return copy;
}

function normalizedSearch(search) {
  const result = { name: String(search.name || "").trim(), url: String(search.url || "").trim(), profile: search.profile, enabled: Boolean(search.enabled) };
  for (const field of SEARCH_NUMBER_FIELDS) result[field] = integerOrNull(search[field], field === "history_hours");
  return result;
}

function normalizedProfile(profile) {
  const flags = {};
  for (const flag of profile.flag_list) {
    const name = flag.name.trim();
    if (name) flags[name] = flag.phrases.slice();
  }
  const result = {
    include_phrases: profile.include_phrases.slice(),
    exclude_phrases: profile.exclude_phrases.slice(),
    flag_phrases: flags,
    price_rules: profile.price_rules.map((rule) => ({
      label: rule.label.trim(), pattern: rule.pattern.trim(), maximum_price: integerOrNull(rule.maximum_price, false),
    })),
  };
  for (const switchName of original.switches) result[switchName] = Boolean(profile[switchName]);
  return result;
}

function typedGeneral(key, value) {
  const type = original.general_types[key];
  if (type === "bool") return Boolean(value);
  if (type === "int") return integerOrNull(value, false);
  if (type === "float") {
    const text = String(value).trim().replace(",", ".");
    return /^\d+(\.\d+)?$/.test(text) ? parseFloat(text) : null;
  }
  return String(value).trim();
}

function collectChanges() {
  const data = {};
  let count = 0;
  const originalDraft = toDraft(original);
  const searchesNow = draft.searches.map(normalizedSearch);
  const searchesBefore = originalDraft.searches.map(normalizedSearch);
  if (stableStringify(searchesNow) !== stableStringify(searchesBefore)) {
    data.searches = searchesNow;
    const before = new Map(searchesBefore.map((search) => [search.name, stableStringify(search)]));
    const now = new Set(searchesNow.map((search) => search.name));
    count += searchesNow.filter((search) => before.get(search.name) !== stableStringify(search)).length;
    count += searchesBefore.filter((search) => !now.has(search.name)).length;
  }
  for (const [name, profile] of Object.entries(draft.profiles)) {
    const now = normalizedProfile(profile);
    const before = originalDraft.profiles[name] ? normalizedProfile(originalDraft.profiles[name]) : null;
    if (!before || stableStringify(now) !== stableStringify(before)) {
      (data.profiles = data.profiles || {})[name] = now;
      count += 1;
    }
  }
  const deleted = Object.keys(original.profiles).filter((name) => !(name in draft.profiles));
  if (deleted.length) {
    data.deleted_profiles = deleted;
    count += deleted.length;
  }
  for (const key of Object.keys(original.general)) {
    const now = typedGeneral(key, draft.general[key]);
    if (stableStringify(now) !== stableStringify(original.general[key])) {
      (data.general = data.general || {})[key] = now;
      count += 1;
    }
  }
  return { data, count };
}

function validationErrors() {
  const errors = [];
  const names = new Set();
  draft.searches.forEach((search, index) => {
    const name = String(search.name || "").trim();
    if (!NAME_PATTERN.test(name)) errors.push(TEXT.errors.searchName(index + 1));
    else if (names.has(name)) errors.push(TEXT.errors.searchDuplicate(name));
    names.add(name);
    const owner = name || "\u2116" + (index + 1);
    if (!AVITO_LINK_PATTERN.test(String(search.url || "").trim())) errors.push(TEXT.errors.searchLink(owner));
    const fieldLabels = { check_interval_seconds: TEXT.searchInterval, minimum_price: TEXT.priceFrom, maximum_price: TEXT.priceTo,
      history_hours: TEXT.historyHours, history_pages: TEXT.historyPages };
    for (const field of SEARCH_NUMBER_FIELDS) {
      if (integerOrNull(search[field], field === "history_hours") === null) errors.push(TEXT.errors.number(fieldLabels[field], owner));
    }
    const interval = integerOrNull(search.check_interval_seconds, false);
    if (interval !== null && interval > 0 && interval < 30) errors.push(TEXT.errors.interval(owner));
    const pages = integerOrNull(search.history_pages, false);
    if (pages !== null && (pages < 1 || pages > 20)) errors.push(TEXT.errors.historyPages(owner));
  });
  for (const [profileName, profile] of Object.entries(draft.profiles)) {
    for (const rule of profile.price_rules) {
      if (!rule.label.trim()) { errors.push(TEXT.errors.modelName(profileName)); continue; }
      if (integerOrNull(rule.maximum_price, false) === null) errors.push(TEXT.errors.number(TEXT.modelName, rule.label));
      try { new RegExp(rule.pattern.trim() || "(?!)"); } catch (error) { errors.push(TEXT.errors.modelPattern(rule.label, error.message)); }
      if (!rule.pattern.trim()) errors.push(TEXT.errors.modelPattern(rule.label, "\u043f\u0443\u0441\u0442\u043e\u0439"));
    }
    if (profile.flag_list.some((flag) => !flag.name.trim() && flag.phrases.length)) errors.push(TEXT.errors.flagName(profileName));
  }
  for (const group of SETTING_GROUPS) {
    for (const [key, label] of group.keys) {
      if (key in draft.general && original.general_types[key] !== "text" && typedGeneral(key, draft.general[key]) === null) {
        errors.push(TEXT.errors.general(label));
      }
    }
  }
  return errors;
}

// ----- save --------------------------------------------------------------------------

function refreshSaveState() {
  const { count } = collectChanges();
  const errors = validationErrors();
  document.getElementById("dirty-note").textContent = count ? TEXT.unsaved(count) : "";
  const label = count > 1 ? TEXT.saveCount(count) : TEXT.save;
  if (inTelegram) {
    const button = webApp.MainButton;
    if (!count) button.hide();
    else {
      button.setText(label);
      if (errors.length) button.disable(); else button.enable();
      button.show();
    }
    try { if (count) webApp.enableClosingConfirmation(); else webApp.disableClosingConfirmation(); } catch (error) { /* older clients */ }
  } else if (original) {
    const footer = document.getElementById("fallback-save");
    const button = document.getElementById("fallback-save-button");
    footer.hidden = !count;
    button.textContent = label;
    button.disabled = errors.length > 0;
  }
}

async function save() {
  const errors = validationErrors();
  if (errors.length) { showNotice(errors[0], "error"); return; }
  const { data, count } = collectChanges();
  if (!count) return;
  const payload = Object.assign({ format: 1, version: original.version }, data);
  if (data.general) {
    payload.general_labels = {};
    for (const group of SETTING_GROUPS) {
      for (const [key, label] of group.keys) if (key in data.general) payload.general_labels[key] = label;
    }
  }
  const formData = FORM_DATA_PREFIX + bytesToBase64Url(await deflateText(JSON.stringify(payload)));
  if (formData.length > SEND_DATA_LIMIT) { showNotice(TEXT.tooLarge, "error"); return; }
  window.lastFormData = formData;
  if (!inTelegram) { showNotice(TEXT.notInTelegram, "error"); return; }
  try { webApp.disableClosingConfirmation(); } catch (error) { /* older clients */ }
  webApp.MainButton.showProgress(false);
  webApp.sendData(formData);
}

// ----- palette -----------------------------------------------------------------------

function applyPalette(paletteId) {
  const palette = PALETTES.find((item) => item.id === paletteId) || PALETTES[0];
  currentPalette = palette.id;
  const rootStyle = document.documentElement.style;
  for (const name of PALETTE_VARIABLES) {
    if (palette.colors) rootStyle.setProperty("--" + name, palette.colors[name]);
    else rootStyle.removeProperty("--" + name);
  }
  document.documentElement.style.colorScheme = palette.scheme || "";
  if (inTelegram) {
    try {
      const canUseHex = webApp.isVersionAtLeast("6.9");
      webApp.setHeaderColor(palette.colors && canUseHex ? palette.colors.bg : "secondary_bg_color");
      webApp.setBackgroundColor(palette.colors && canUseHex ? palette.colors.bg : "secondary_bg_color");
      if (webApp.isVersionAtLeast("7.10")) webApp.setBottomBarColor(palette.colors ? palette.colors.bg : "secondary_bg_color");
      webApp.MainButton.setParams(palette.colors
        ? { color: palette.colors.accent, text_color: palette.colors["accent-ink"] }
        : { color: webApp.themeParams.button_color, text_color: webApp.themeParams.button_text_color });
    } catch (error) { /* older clients keep their own colors */ }
  }
}

function rememberPalette(paletteId) {
  try { localStorage.setItem(PALETTE_STORAGE_KEY, paletteId); } catch (error) { /* storage blocked */ }
  if (inTelegram && webApp.CloudStorage && webApp.isVersionAtLeast("6.9")) {
    try { webApp.CloudStorage.setItem(PALETTE_STORAGE_KEY, paletteId); } catch (error) { /* older clients */ }
  }
}

function loadPalette() {
  let stored = "";
  try { stored = localStorage.getItem(PALETTE_STORAGE_KEY) || ""; } catch (error) { /* storage blocked */ }
  applyPalette(stored || "telegram");
  if (inTelegram && webApp.CloudStorage && webApp.isVersionAtLeast("6.9")) {
    try {
      webApp.CloudStorage.getItem(PALETTE_STORAGE_KEY, (error, value) => {
        if (!error && value && value !== currentPalette) {
          applyPalette(value);
          if (currentTab === "look") render();
        }
      });
    } catch (error) { /* older clients */ }
  }
}

// ----- rendering ---------------------------------------------------------------------

function groupTitle(text, extra) {
  return element("div", { className: "group-title" }, [element("span", { text }), extra || null]);
}

function hint(text) {
  return text ? element("div", { className: "hint", text }) : null;
}

function groupHint(text) {
  return text ? element("div", { className: "hint group-hint", text }) : null;
}

function switchControl(checked, label, onChange) {
  return element("label", { className: "switch" }, [
    element("input", { type: "checkbox", checked, "aria-label": label, onchange: (event) => { onChange(event.target.checked); refreshSaveState(); } }),
    element("span"),
  ]);
}

function textInput(value, attributes, onInput) {
  return element("input", Object.assign({ className: "input", value, autocomplete: "off", spellcheck: "false",
    oninput: (event) => { onInput(event.target.value, event.target); refreshSaveState(); } }, attributes));
}

function numberInput(value, attributes, onInput, allowNegative) {
  return textInput(value, Object.assign({ inputmode: allowNegative ? "text" : "numeric", className: "input short" }, attributes), (text, input) => {
    input.classList.toggle("invalid", integerOrNull(text, allowNegative) === null);
    onInput(text);
  });
}

function textArea(lines, className, onInput, placeholder) {
  return element("textarea", { className: "textarea" + (className ? " " + className : ""), placeholder, spellcheck: "false",
    oninput: (event) => { onInput(event.target.value); refreshSaveState(); } }, lines);
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren(...Object.entries(TEXT.tabs).map(([id, label]) => element("button", {
    className: "tab", type: "button", role: "tab", "aria-selected": String(id === currentTab), text: label,
    onclick: () => { currentTab = id; renderTabs(); render(); window.scrollTo(0, 0); },
  })));
}

        check_interval_seconds: String(draft.general.default_check_interval_seconds), minimum_price: "", maximum_price: "", history_hours: "0", history_pages: "3" };
      newSearches.add(search);

function renderRule(profile, rule, index) {

          autoPatternRules.add(rule);
          rule.pattern = patternFromLabel(value);
          patternInput.value = rule.pattern;
        }

      element("span", { className: "price-box" }, [

  nodes.push(groupTitle(TEXT.flags));
  nodes.push(element("div", { className: "group" }, profile.flag_list.map((flag, index) => element("div", { className: "row" }, [
    element("div", { className: "row-line", style: "margin-bottom: 7px" }, [
      textInput(flag.name, { className: "input name-input", placeholder: TEXT.flagName, "aria-label": TEXT.flagName }, (value) => { flag.name = value; }),
      element("button", { type: "button", className: "remove", "aria-label": TEXT.removeFlag, text: "\u00d7",
        onclick: () => { profile.flag_list.splice(index, 1); render(); refreshSaveState(); } }),
    ]),
    textArea(flag.phrases.join("\n"), "", (value) => { flag.phrases = linesOf(value); }),
  ])).concat([element("div", { className: "add-row" }, [element("button", { type: "button", className: "text-button", text: "+ " + TEXT.addFlag,
    onclick: () => { profile.flag_list.push({ name: "", phrases: [] }); render(); } })])])));
  nodes.push(groupHint(TEXT.flagsHint));

  nodes.push(groupTitle(TEXT.more));
  nodes.push(element("div", { className: "group" }, ["skip_reserved", "hide_expensive", "hide_cheap"].map((switchName) => element("div", { className: "row row-line" }, [
    element("div", {}, [element("div", { className: "label", text: TEXT.switches[switchName][0] }), hint(TEXT.switches[switchName][1])]),
    switchControl(profile[switchName], TEXT.switches[switchName][0], (value) => { profile[switchName] = value; }),
  ]))));

  const users = draft.searches.filter((search) => search.profile === currentProfile).map((search) => search.name || "?");
  const deleteBlocked = currentProfile === "default" ? TEXT.defaultProfileKept : users.length ? TEXT.profileInUse(users.join(", ")) : "";
  nodes.push(element("div", { className: "group", style: "margin-top: 22px" }, [element("div", { className: "row" }, [
    element("button", { type: "button", className: "text-button danger", text: TEXT.deleteProfile, disabled: Boolean(deleteBlocked),
      onclick: () => { delete draft.profiles[currentProfile]; currentProfile = ""; render(); refreshSaveState(); } }),
    hint(deleteBlocked),
  ])]));
  return nodes;
}

function generalControl(key, label) {
  const type = original.general_types[key];
  const choices = (original.general_choices || {})[key];
  if (type === "bool") return switchControl(draft.general[key], label, (value) => { draft.general[key] = value; });
  if (choices) {
    const names = TEXT.choices[key] || {};
    return element("select", { className: "select", style: "width: auto; max-width: 55%", "aria-label": label,
      onchange: (event) => { draft.general[key] = event.target.value; refreshSaveState(); } },
    choices.map((value) => element("option", { value, text: names[value] || value, selected: value === draft.general[key] })));
  }
  if (type === "text") return textInput(draft.general[key], { placeholder: "\u2014", "aria-label": label, style: "max-width: 55%" }, (value) => { draft.general[key] = value; });
  return textInput(draft.general[key], { className: "input short", inputmode: type === "float" ? "decimal" : "numeric", "aria-label": label },
    (value, input) => { draft.general[key] = value; input.classList.toggle("invalid", typedGeneral(key, value) === null); });
}

function generalRow(key, label, note, details) {
  const open = openDetails.has(key);
  return element("div", { className: "row" }, [
    element("div", { className: "row-line" }, [element("div", {}, [element("div", { className: "label", text: label }), hint(note)]), generalControl(key, label)]),
    details ? element("button", { type: "button", className: "text-button small more-link", "aria-expanded": String(open),
      text: open ? TEXT.detailsHide : TEXT.details,
      onclick: () => { if (open) openDetails.delete(key); else openDetails.add(key); render(); } }) : null,
    details && open ? element("div", { className: "details", text: details }) : null,
  ]);
}

function renderGeneral() {
  const nodes = [];
  const known = new Set(HIDDEN_GENERAL_KEYS);
  for (const group of SETTING_GROUPS) for (const [key] of group.keys) known.add(key);
  const groups = SETTING_GROUPS.map((group) => ({ title: group.title, hint: group.hint, keys: group.keys.filter(([key]) => key in draft.general) }));
  const others = Object.keys(draft.general).filter((key) => !known.has(key));
  if (others.length) groups.push({ title: "\u041f\u0440\u043e\u0447\u0435\u0435", keys: others.map((key) => [key, key, "", ""]) });
  for (const group of groups) {
    if (!group.keys.length) continue;
    nodes.push(groupTitle(group.title));
    if (group.hint) nodes.push(element("div", { className: "hint group-hint above", text: group.hint }));
    nodes.push(element("div", { className: "group" }, group.keys.map(([key, label, note, details]) => generalRow(key, label, note, details))));
  }
  return nodes;
}

function renderLook() {
  return [
    groupTitle(TEXT.palette),
    element("div", { className: "group", role: "radiogroup" }, PALETTES.map((palette) => {
      const colors = palette.colors || { bg: "var(--tg-theme-secondary-bg-color, #efeff4)", surface: "var(--tg-theme-bg-color, #fff)",
        accent: "var(--tg-theme-button-color, #2f7cf6)", tag: "var(--tg-theme-link-color, #2f7cf6)" };
      return element("button", { type: "button", className: "palette-row", role: "radio", "aria-checked": String(palette.id === currentPalette),
        onclick: () => { applyPalette(palette.id); rememberPalette(palette.id); render(); } }, [
        element("span", { className: "swatches", "aria-hidden": "true" }, [colors.bg, colors.surface, colors.accent, colors.tag].map((color) => element("i", { style: "background:" + color }))),
        element("span", { className: "palette-text" }, [element("div", { className: "label", text: palette.name }), hint(palette.hint)]),
        element("span", { className: "check", text: "\u2713" }),
      ]);
    })),
    groupHint(TEXT.paletteHint),
  ];
}

function render() {
  const content = document.getElementById("content");
  if (!original) return;
  const builders = { searches: renderSearches, filters: renderFilters, general: renderGeneral, look: renderLook };
  content.replaceChildren(...builders[currentTab]().filter(Boolean));
}

function renderEmpty(title, details) {
  document.getElementById("tabs").hidden = true;
  document.getElementById("content").replaceChildren(element("div", { className: "empty" }, [element("strong", { text: title }), details || ""]));
}

// ----- start -------------------------------------------------------------------------

async function start() {
  if (webApp) {
    try { webApp.ready(); webApp.expand(); } catch (error) { /* outside Telegram */ }
    if (inTelegram) webApp.MainButton.onClick(save);
  }
  document.getElementById("fallback-save-button").addEventListener("click", save);
  loadPalette();
  const encoded = hashData();
  if (!encoded) { renderEmpty(TEXT.noData, TEXT.noDataHint); return; }
  if (typeof DecompressionStream === "undefined" || typeof CompressionStream === "undefined") { renderEmpty(TEXT.unsupported); return; }
  try {
    original = JSON.parse(await inflateText(base64UrlToBytes(encoded)));
    if (original.format !== 1) throw new Error("format");
    draft = toDraft(original);
  } catch (error) {
    renderEmpty(TEXT.brokenData);
    return;
  }
  renderTabs();
  render();
  refreshSaveState();
}

start();
</script>
</body>
</html>
